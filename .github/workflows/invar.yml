name: invar consumers
on: pull_request
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Ramesh-35/invar@main
        with:
          check: 'false'
          dependents_repo: Ramesh-35/invar-demo-api
          dependents_locks: .invar/index
          dependents_signers: .invar/consumer-signers
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Ramesh-35/invar@7eee62014886f3b35d6ec4dcec00549f1cc709cf # v0.2.6
        with:
          check: 'false'
          judge_contracts: 'schemas/*.json'
