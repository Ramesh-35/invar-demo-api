name: invar consumers
on: pull_request
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Ramesh-35/invar@main
        with:
          check: 'false'
          dependents_repo: Ramesh-35/invar-demo-api
          dependents_locks: .invar/index
          dependents_signers: .invar/consumer-signers
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Ramesh-35/invar@main
        with:
          check: 'false'
          version: v0.2.0
          judge_contract: schemas/media_player.json
