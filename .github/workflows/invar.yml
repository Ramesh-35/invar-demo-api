name: invar consumers
on: pull_request
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  consumers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Ramesh-35/invar@main
        with:
          check: 'false'
          dependents_repo: Ramesh-35/invar-demo-api
          dependents_locks: .invar/index
          dependents_signers: .invar/consumer-signers
  judge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Ramesh-35/invar@06c8a8e274e0faadb483c41869456f04f4e7b6c9 # v0.2.5
        with:
          check: 'false'
          judge_contracts: 'schemas/*.json'
